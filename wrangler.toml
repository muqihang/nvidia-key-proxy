name = "ds-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

# KV namespace 绑定（部署前需创建并填入 ID）
[[kv_namespaces]]
binding = "KEY_MAPPINGS"
id = "fcc7fe0a1ad946829d983de70f1cde0d"

[[durable_objects.bindings]]
name = "USAGE_COUNTERS"
class_name = "UsageCounter"

[[migrations]]
tag = "v1-usage-counters"
new_sqlite_classes = ["UsageCounter"]

[observability]
enabled = true
head_sampling_rate = 0.1

# 管理接口鉴权 token（部署前需设置 wrangler secret）
# wrangler secret put ADMIN_TOKEN
